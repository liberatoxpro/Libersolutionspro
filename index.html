<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070e15"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>LIBER AGRO PRO | Grupo Liberato</title><link rel="stylesheet" href="style.css"></head><body><div id="appLoader" class="app-loader"><div class="loading-mark loading-brand"><img src="47CF89AD-2FC4-44B2-A9E5-80EE8FE61863.png" alt="Símbolo Liber original" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="brand-fallback" style="display:none" aria-hidden="true">L</span></div><div class="loading-track" role="status" aria-label="Carregando"><i></i></div></div><div id="app"></div><section id="printArea"></section><script>
(function(){
  var loader=document.getElementById('appLoader');
  var startupError='';
  function showFailure(message){startupError=String(message||'Falha desconhecida').slice(0,500);recover();var app=document.getElementById('app');if(app&&app.querySelector('[data-startup-error]'))app.querySelector('[data-startup-error]').textContent=startupError;}
  function recover(){
    if(!loader||loader.classList.contains('hidden'))return;
    loader.classList.add('hidden');
    var app=document.getElementById('app');
    if(app&&!app.textContent.trim()){
      app.innerHTML='<main style="padding:calc(env(safe-area-inset-top, 20px) + 40px) 24px 30px;color:#ecf7f3;font:16px -apple-system,Arial,sans-serif"><h1>LIBER AGRO PRO</h1><p>Não foi possível abrir o painel nesta tentativa. Seus registros locais não foram apagados.</p><button style="border:0;border-radius:14px;background:#b8ff58;padding:16px;font-weight:700" onclick="location.reload()">Tentar novamente</button><p style="margin-top:24px;font-size:12px;opacity:.8;overflow-wrap:anywhere" data-startup-error></p></main>';
    }
  }
  window.addEventListener('error',function(e){console.error('Falha na inicialização:',e.message);showFailure((e.filename||'app')+':'+(e.lineno||'?')+' — '+e.message)});
  window.addEventListener('unhandledrejection',function(e){console.error('Falha assíncrona:',e.reason);showFailure(e.reason&&e.reason.stack||e.reason)});
  setTimeout(recover,5000);
})();
</script><script src="app.js" onerror="document.getElementById('appLoader')?.classList.add('hidden');document.getElementById('app').textContent='Erro ao carregar app.js. Verifique os arquivos incluídos no IPA.'"></script></body></html>
